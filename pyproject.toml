[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adryserage-aetheris"
version = "4.0.1"
description = "MCP server with code review rules and reproducible checks (secrets, OSV vulnerabilities, metrics, dependency graphs) for AI coding assistants. No API key needed."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
    {name = "Adryan Serage", email = "adryan@allowebs.com"}
]
maintainers = [
    {name = "Adryan Serage", email = "adryan@allowebs.com"}
]
keywords = [
    "mcp", "mcp-server", "model-context-protocol", "code-review", "static-analysis",
    "security", "secret-scanning", "vulnerability-scanner", "osv", "code-quality",
    "pr-review", "claude-code", "cursor", "ai-coding-assistant", "llm"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Bug Tracking",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Framework :: Pydantic :: 2",
    "Natural Language :: English",
    "Typing :: Typed",
]

dependencies = [
    "mcp>=1.10,<2",
    "pydantic>=2.0.0",
    "pathspec>=0.12.0",
    "requests>=2.32.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Hosted HTTP mode (aetheris serve --http). uvicorn, starlette and httpx come with mcp.
hosted = ["sentry-sdk>=2.0,<3"]

[project.urls]
Homepage = "https://github.com/adryserage/aetheris"
Repository = "https://github.com/adryserage/aetheris"
Issues = "https://github.com/adryserage/aetheris/issues"
Changelog = "https://github.com/adryserage/aetheris/blob/main/CHANGELOG.md"

[project.scripts]
adryserage-aetheris = "aetheris.server:main"
aetheris = "aetheris.cli:entry"

[tool.setuptools.packages.find]
where = ["."]
include = ["aetheris*"]

[tool.setuptools.package-data]
aetheris = ["rules/*.yaml", "playbooks/*/*.md", "playbooks/*/LICENSE", "py.typed"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312", "py313"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | __pycache__
)/
'''

