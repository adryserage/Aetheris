[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adryserage-aetheris"
version = "2.2.1"
description = "Aetheris by Adryan - Système d'analyse de code multi-agents avec plusieurs agents coopérants"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Adryan from Allowebs.com"}
]
keywords = ["code-analysis", "code-review", "static-analysis", "security", "quality-assurance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Topic :: Security",
]

dependencies = [
    "google-genai>=1.0.0",
    "pydantic>=2.0.0",
    "openai>=1.0.0",
    "anthropic>=0.25.0",
    "pathspec>=0.12.0",
    "requests>=2.32.0",
    "pyyaml>=6.0",
    "ddgs>=1.0.0",
    "rich>=13.0.0",
]

[project.scripts]
aetheris = "src.cli:main"

[project.urls]
Homepage = "https://github.com/adryserage/aetheris"
Repository = "https://github.com//adryserage/aetheris"
Issues = "https://github.com/adryserage/aetheris/issues"

[tool.setuptools]
packages = ["src", "src.agents", "src.core", "src.models", "src.services"]

[tool.setuptools.package-data]
"*" = ["*.md", "*.txt", "*.yaml", "*.yml"]

[tool.black]
line-length = 100
target-version = ["py38", "py39", "py310", "py311", "py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | __pycache__
)/
'''

