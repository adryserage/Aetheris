[mypy]
python_version = 3.11
ignore_missing_imports = True
warn_return_any = False
warn_unused_ignores = False
show_error_codes = True
no_error_summary = True

# External library modules with strict typing that conflicts with our usage
[mypy-google.generativeai.*]
ignore_errors = True

[mypy-anthropic.*]
ignore_errors = True

[mypy-openai.*]
ignore_errors = True

# AI providers module uses dynamic typing patterns
[mypy-src.core.ai_providers]
ignore_errors = True
