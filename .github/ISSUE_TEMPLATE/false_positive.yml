name: False positive
description: A check or rule flagged code that is fine.
labels: [false-positive]
body:
  - type: input
    id: rule
    attributes:
      label: Rule id or check name
      description: The `rule_id` of the finding (for example SEC-001) or the check name at the start of its message.
    validations:
      required: true
  - type: textarea
    id: code
    attributes:
      label: Code that was flagged
      description: The smallest snippet that reproduces it. Mask any secret.
      render: text
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it is not a problem
      description: What makes this code safe or correct.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Aetheris version
      description: Output of `aetheris --version`.
