name: Run Aetheris Analysis

# Ce workflow ne s'exécute QUE manuellement via l'onglet Actions de GitHub
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Mode d'analyse"
        required: true
        type: choice
        options:
          - full
          - changed
        default: "full"

permissions:
  contents: read
  packages: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install Aetheris from PyPI
        run: |
          python -m pip install --upgrade pip
          pip install adryserage-aetheris
      
      - name: Configure GEMINI_API_KEY
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "GEMINI_API_KEY=$GEMINI_API_KEY" >> $GITHUB_ENV
      
      - name: Run Aetheris Analysis (Full)
        if: inputs.mode == 'full'
        run: |
          aetheris analysis
      
      - name: Run Aetheris Analysis (Changed Files)
        if: inputs.mode == 'changed'
        run: |
          # Exemple avec fichiers modifiés
          aetheris analysis --changed-files-only --files "main.py,src/cli.py"
      
      - name: Upload analysis reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aetheris-analysis-reports
          path: |
            docs/analyses/
            docs/architecture_overview.md
          retention-days: 30

