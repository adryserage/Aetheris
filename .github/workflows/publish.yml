name: Publish Package

on:
  push:
    tags:
      - "v*.*.*" # Déclenché sur les tags de version (ex: v1.0.0)
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de version à utiliser (ex: v1.1.0)"
        required: true
        type: string

permissions:
  contents: read
  id-token: write # Nécessaire pour l'authentification OIDC avec PyPI Trusted Publisher

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build wheel twine

      - name: Build package
        run: |
          python -m build

      - name: Extract version from tag
        id: tag_version
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          GITHUB_REF_VAL: ${{ github.ref }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            VERSION=${INPUT_TAG#v}
          else
            VERSION=${GITHUB_REF_VAL#refs/tags/v}
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Publish to PyPI using Trusted Publisher
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
