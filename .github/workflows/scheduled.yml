# Weekly checks: known vulnerabilities, static security analysis, and an install on the next Python.

name: Scheduled

on:
  schedule:
    - cron: '0 4 * * 0'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      - name: Audit project dependencies (pip-audit)
        run: pipx run pip-audit --strict --progress-spinner off .

      - name: Static security analysis (bandit)
        run: pipx run bandit -r aetheris -ll -ii

  # A dependency with no wheel for a new Python broke installs on 3.15 before the CI saw it.
  # When this version is released, it moves into the ci.yml matrix and this job moves to the next.
  next-python:
    name: Install on the next Python (pre-release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.16'
          allow-prereleases: true

      - name: Install and start the server
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install .
          export PATH="$RUNNER_TEMP/venv/bin:$PATH"
          cd "$RUNNER_TEMP"
          aetheris --version
          timeout 5 adryserage-aetheris </dev/null
