# Scheduled workflow: daily PyPI download stats and weekly security scan.

name: Scheduled

on:
  schedule:
    # Daily stats: 6 AM UTC
    - cron: '0 6 * * *'
    # Weekly security: Sunday at 4 AM UTC
    - cron: '0 4 * * 0'
  workflow_dispatch:
    inputs:
      job:
        description: 'Job to run'
        type: choice
        options:
          - download-stats
          - security-scan
        default: download-stats

permissions:
  contents: write
  security-events: write
  actions: read

env:
  PYTHON_VERSION: '3.11'

jobs:
  download-stats:
    name: Update Download Stats
    runs-on: ubuntu-latest
    if: |
      (github.event.schedule == '0 6 * * *') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'download-stats')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pypistats matplotlib

      - name: Generate download chart
        run: python scripts/generate_download_chart.py

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add assets/charts/
          git diff --staged --quiet || git commit -m "chore: update download statistics chart"
          git push

  # ============================================
  # WEEKLY SECURITY: Dependency vulnerability scan
  # NOTE: CodeQL requires GitHub Advanced Security (Organization plan for private repos)
  # Using pip-audit for dependency security scanning instead
  # ============================================
  weekly-security:
    name: Weekly Security Scan
    runs-on: ubuntu-latest
    if: |
      (github.event.schedule == '0 4 * * 0') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'security-scan')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pip-audit safety bandit
          pip install -e .

      - name: Run pip-audit
        run: pip-audit --strict --progress-spinner=off

      - name: Run safety check
        run: safety check --full-report || true

      - name: Run bandit security linter
        run: bandit -r src/ -ll -ii || true
