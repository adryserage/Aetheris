# Weekly security scan: known vulnerabilities in dependencies and static security analysis.

name: Scheduled

on:
  schedule:
    - cron: '0 4 * * 0'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Audit project dependencies (pip-audit)
        run: pipx run pip-audit --strict --progress-spinner off .

      - name: Static security analysis (bandit)
        run: pipx run bandit -r aetheris -ll -ii
