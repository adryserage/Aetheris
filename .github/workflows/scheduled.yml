# Consolidated Scheduled workflow: Weekly analysis, Stats, Release analysis
# Replaces: aetheris-weekly.yml, aetheris-release.yml, update-download-stats.yml

name: Scheduled

on:
  schedule:
    # Weekly analysis: Saturday at 3 AM UTC
    - cron: '0 3 * * 6'
    # Daily stats: 6 AM UTC
    - cron: '0 6 * * *'
    # Weekly security: Sunday at 4 AM UTC
    - cron: '0 4 * * 0'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      job:
        description: 'Job to run'
        type: choice
        options:
          - weekly-analysis
          - download-stats
          - release-analysis
          - security-scan
        default: weekly-analysis
      skip_issues:
        description: 'Skip creating GitHub issues (weekly only)'
        type: boolean
        default: false
      skip_pr_gen:
        description: 'Skip generating fix PRs (weekly only)'
        type: boolean
        default: false
      run_autofix:
        description: 'Run auto-fix experimental (weekly only)'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  security-events: write
  actions: read

env:
  PYTHON_VERSION: '3.11'

jobs:
  # ============================================
  # WEEKLY ANALYSIS: Full codebase analysis
  # ============================================
  weekly-analysis:
    name: Full Codebase Analysis
    runs-on: ubuntu-latest
    if: |
      (github.event.schedule == '0 3 * * 6') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'weekly-analysis')
    outputs:
      has_findings: ${{ steps.analyze.outputs.has_findings }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Aetheris
        run: pip install adryserage-aetheris

      - name: Run full analysis
        id: analyze
        run: |
          echo "Starting Aetheris analysis..."
          aetheris analysis --timeout 60m || true

          if [ -f "docs/analyses/quality_assurance_report.md" ]; then
            echo "has_findings=true" >> $GITHUB_OUTPUT
            echo "Analysis complete. Report generated."
          else
            echo "has_findings=false" >> $GITHUB_OUTPUT
            echo "No report generated."
          fi
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_PROVIDER: ${{ secrets.AI_PROVIDER || 'gemini' }}

      - name: Upload analysis artifacts
        uses: actions/upload-artifact@v4
        with:
          name: analysis-reports
          path: |
            docs/analyses/
            docs/metrics/
          retention-days: 30


  create-issues:
    name: Create GitHub Issues
    needs: weekly-analysis
    if: needs.weekly-analysis.outputs.has_findings == 'true' && github.event.inputs.skip_issues != 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Pull latest changes
        run: git pull origin main || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Aetheris
        run: pip install adryserage-aetheris

      - name: Create issues from analysis
        run: |
          echo "Creating GitHub issues from analysis findings..."
          aetheris issues --labels "aetheris,automated" || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

  generate-fix-prs:
    name: Generate Fix PRs
    needs: create-issues
    if: github.event.inputs.skip_pr_gen != 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Pull latest changes
        run: git pull origin main || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Aetheris
        run: pip install adryserage-aetheris

      - name: Generate fix PRs
        run: |
          echo "Generating fix PRs linked to issues..."
          aetheris pr-gen --link-issues || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

  auto-fix:
    name: Auto-Fix (Experimental)
    needs: weekly-analysis
    if: github.event.inputs.run_autofix == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Pull latest changes
        run: git pull origin main || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Aetheris
        run: pip install adryserage-aetheris

      - name: Run auto-fix
        run: |
          echo "Running auto-fix (experimental)..."
          aetheris fix --analyze-first --auto || true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Create PR with fixes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="autofix/weekly-$(date +%Y%m%d)"
          git checkout -b "$BRANCH" || true
          git add -A
          git diff --staged --quiet || git commit -m "fix: auto-fix from weekly analysis"
          git push -u origin "$BRANCH" || true
          gh pr create --title "Auto-fix: Weekly Analysis Fixes" --body "Automated fixes from Aetheris weekly analysis" --label "autofix,automated" || true

  # ============================================
  # RELEASE ANALYSIS: Analyze release changes
  # ============================================
  release-analysis:
    name: Analyze Release Changes
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'release') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'release-analysis')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Aetheris
        run: pip install adryserage-aetheris

      - name: Run incremental analysis
        run: |
          echo "Analyzing changes in release..."
          aetheris analysis --reanalyze --timeout 30m || true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_PROVIDER: ${{ secrets.AI_PROVIDER || 'gemini' }}

      - name: Upload analysis artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-analysis
          path: |
            docs/analyses/
            docs/metrics/
          retention-days: 90


  # ============================================
  # DOWNLOAD STATS: Daily PyPI statistics
  # ============================================
  download-stats:
    name: Update Download Stats
    runs-on: ubuntu-latest
    if: |
      (github.event.schedule == '0 6 * * *') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'download-stats')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pypistats matplotlib

      - name: Generate download chart
        run: python scripts/generate_download_chart.py

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add assets/charts/
          git diff --staged --quiet || git commit -m "chore: update download statistics chart"
          git push

  # ============================================
  # WEEKLY SECURITY: Dependency vulnerability scan
  # NOTE: CodeQL requires GitHub Advanced Security (Organization plan for private repos)
  # Using pip-audit for dependency security scanning instead
  # ============================================
  weekly-security:
    name: Weekly Security Scan
    runs-on: ubuntu-latest
    if: |
      (github.event.schedule == '0 4 * * 0') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'security-scan')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pip-audit safety bandit
          pip install -e .

      - name: Run pip-audit
        run: pip-audit --strict --progress-spinner=off

      - name: Run safety check
        run: safety check --full-report || true

      - name: Run bandit security linter
        run: bandit -r src/ -ll -ii || true
