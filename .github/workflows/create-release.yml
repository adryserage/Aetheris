name: Create Release

on:
  push:
    tags:
      - "v*.*.*" # Déclenché sur les tags de version (ex: v1.0.0)
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de version à utiliser (ex: v1.1.0)"
        required: true
        type: string

permissions:
  contents: write # Nécessaire pour créer des releases

jobs:
  create-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Nécessaire pour avoir accès à tous les commits et tags

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Extract version from tag
        id: tag_version
        run: |
          # Si déclenché manuellement, utiliser l'input tag, sinon utiliser GITHUB_REF
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
            # Enlever le préfixe 'v' si présent
            VERSION=${TAG#v}
            TAG_NAME=$TAG
            # S'assurer que le tag commence par 'v'
            if [[ ! $TAG_NAME =~ ^v ]]; then
              TAG_NAME="v$VERSION"
            fi
          else
            # Déclenché par push de tag
            VERSION=${GITHUB_REF#refs/tags/v}
            TAG_NAME="v$VERSION"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "Version extraite: $VERSION"
          echo "Tag name: $TAG_NAME"

      - name: Extract release notes from CHANGELOG
        id: release_notes
        run: |
          python scripts/extract_release_notes.py "${{ steps.tag_version.outputs.version }}" > release_notes.md || echo "## Release ${{ steps.tag_version.outputs.tag_name }}" > release_notes.md
          echo "✅ Notes de release extraites"

      - name: Display release notes preview
        run: |
          echo "📝 Aperçu des notes de release:"
          echo "---"
          head -n 20 release_notes.md 2>/dev/null || python -c "with open('release_notes.md', 'r', encoding='utf-8') as f: print(''.join(f.readlines()[:20]))"
          echo "---"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_version.outputs.tag_name }}
          name: Release ${{ steps.tag_version.outputs.tag_name }}
          body_path: release_notes.md
          draft: false
          prerelease: ${{ contains(steps.tag_version.outputs.version, '-alpha') || contains(steps.tag_version.outputs.version, '-beta') || contains(steps.tag_version.outputs.version, '-rc') }}
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
