name: Build Wheels

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:  # Allow manual triggering

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel==2.22.0

      - name: Build wheels
        run: python -m cibuildwheel --output-dir wheelhouse
        env:
          # Build for specific Python versions (3.8-3.13)
          CIBW_BUILD: "cp38-* cp39-* cp310-* cp311-* cp312-* cp313-*"
          # Skip 32-bit, musllinux, and PyPy
          CIBW_SKIP: "*-win32 *-manylinux_i686 *musllinux* pp*"
          # Platform-specific architecture configuration
          CIBW_ARCHS_LINUX: "x86_64"
          CIBW_ARCHS_MACOS: "x86_64 arm64"
          CIBW_ARCHS_WINDOWS: "AMD64"
          # Use manylinux2014 for broader compatibility
          CIBW_MANYLINUX_X86_64_IMAGE: "manylinux2014"
          # Test command to verify wheel works
          CIBW_TEST_COMMAND: "aetheris --help"
          # Install test dependencies
          CIBW_TEST_REQUIRES: "pydantic>=2.0.0"
          # Before build: ensure build deps are available
          CIBW_BEFORE_BUILD: "pip install Cython>=3.0"

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl
          retention-days: 7

  # Combine all wheels into single artifact
  combine_wheels:
    name: Combine all wheels
    needs: build_wheels
    runs-on: ubuntu-latest
    steps:
      - name: Download all wheel artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-wheels
          pattern: wheels-*
          merge-multiple: true

      - name: Upload combined wheels
        uses: actions/upload-artifact@v4
        with:
          name: all-wheels
          path: all-wheels/*.whl
          retention-days: 30
