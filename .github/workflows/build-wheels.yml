name: Build Wheels

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:  # Allow manual triggering

permissions:
  contents: read

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up QEMU
        if: runner.os == 'Linux'
        uses: docker/setup-qemu-action@53851d14592bedcffcf25ea515637cff71ef929a # v3.4.0
        with:
          platforms: arm64

      - name: Set up Python
        uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55 # v5.5.0
        with:
          python-version: '3.12'

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel==2.22.0

      - name: Build wheels
        # Configuration is read from pyproject.toml [tool.cibuildwheel]
        # Python versions are auto-detected from requires-python (>=3.9)
        # This ensures new Python versions are automatically supported
        run: python -m cibuildwheel --output-dir wheelhouse
        env:
          # Platform-specific architecture configuration
          CIBW_ARCHS_LINUX: "x86_64 aarch64"
          # Use manylinux2014 for broader compatibility
          CIBW_MANYLINUX_X86_64_IMAGE: "manylinux2014"
          CIBW_MANYLINUX_AARCH64_IMAGE: "manylinux2014"
          # Before build: ensure build deps are available
          CIBW_BEFORE_BUILD: "pip install Cython>=3.0"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl
          retention-days: 7

  # Combine all wheels into single artifact
  combine_wheels:
    name: Combine all wheels
    needs: build_wheels
    runs-on: ubuntu-latest
    steps:
      - name: Download all wheel artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          path: all-wheels
          pattern: wheels-*
          merge-multiple: true

      - name: Upload combined wheels
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: all-wheels
          path: all-wheels/*.whl
          retention-days: 30
