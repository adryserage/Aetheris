# =============================================================================
# Aetheris Code Analysis - Railway Worker Trigger (v3.0)
# =============================================================================
#
# This workflow triggers the Aetheris Railway worker for AI-powered code analysis.
# The actual analysis runs on Railway infrastructure for better performance.
#
# SETUP:
# 1. Deploy the Aetheris worker to Railway (see worker/README.md)
# 2. Add secrets to your repository:
#    - AETHERIS_WORKER_URL: Your Railway worker URL (e.g., https://your-app.railway.app)
#    - AETHERIS_WEBHOOK_SECRET: Secret for webhook authentication
#    Settings > Secrets > Actions > New repository secret
#
# FEATURES:
# - Automatic analysis on push to main/develop branches
# - Pull request analysis with comments posted by worker
# - Manual trigger with mode selection
# - Lightweight GitHub Actions (just triggers, no heavy processing)
#
# =============================================================================

name: Aetheris Analysis

on:
  # Automatic triggers
  push:
    branches: [main, develop]
  pull_request:
    types: [opened, synchronize, reopened]

  # Manual trigger with options
  workflow_dispatch:
    inputs:
      mode:
        description: "Analysis mode"
        type: choice
        options:
          - analysis
          - fix
        default: analysis
      timeout:
        description: "Timeout duration (e.g., 30m, 1h, 2h)"
        type: string
        default: "60m"
      full_scan:
        description: "Force full codebase scan"
        type: boolean
        default: false

# Prevent concurrent runs on the same branch
concurrency:
  group: aetheris-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trigger-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 5  # Quick job - just triggers the worker

    permissions:
      contents: read

    steps:
      # ==================================
      # Validate Configuration
      # ==================================
      - name: Validate secrets
        env:
          WORKER_URL: ${{ secrets.AETHERIS_WORKER_URL }}
        run: |
          if [ -z "$WORKER_URL" ]; then
            echo "::error::Missing AETHERIS_WORKER_URL secret"
            echo ""
            echo "To fix this:"
            echo "1. Deploy Aetheris worker to Railway (see worker/README.md)"
            echo "2. Go to Settings > Secrets and variables > Actions"
            echo "3. Add 'AETHERIS_WORKER_URL' with your Railway URL"
            echo "   Example: https://your-app.railway.app"
            exit 1
          fi
          echo "✓ Worker URL configured"

      # ==================================
      # Trigger Railway Worker
      # ==================================
      - name: Trigger Aetheris Worker
        env:
          WORKER_URL: ${{ secrets.AETHERIS_WORKER_URL }}
          WEBHOOK_SECRET: ${{ secrets.AETHERIS_WEBHOOK_SECRET }}
          GITHUB_EVENT: ${{ github.event_name }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_TIMEOUT: ${{ inputs.timeout }}
          INPUT_FULL_SCAN: ${{ inputs.full_scan }}
          # Safe environment variables for potentially user-controlled data
          PR_ACTION: ${{ github.event.action }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_REF: ${{ github.ref }}
          PUSH_SHA: ${{ github.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          REPO_FULL_NAME: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
        run: |
          # Build payload based on event type using safe environment variables
          if [ "$GITHUB_EVENT" = "pull_request" ]; then
            # Escape JSON special characters in user-controlled fields
            SAFE_PR_HEAD_REF=$(echo "$PR_HEAD_REF" | jq -Rs '.')
            SAFE_ACTOR=$(echo "$ACTOR" | jq -Rs '.')

            PAYLOAD=$(jq -n \
              --arg action "$PR_ACTION" \
              --argjson pr_number "${PR_NUMBER:-0}" \
              --arg head_ref "$PR_HEAD_REF" \
              --arg head_sha "$PR_HEAD_SHA" \
              --arg repo_name "$REPO_FULL_NAME" \
              --arg actor "$ACTOR" \
              '{
                action: $action,
                pull_request: {
                  number: $pr_number,
                  head: {
                    ref: $head_ref,
                    sha: $head_sha
                  }
                },
                repository: {
                  full_name: $repo_name,
                  clone_url: ("https://github.com/" + $repo_name + ".git")
                },
                sender: {
                  login: $actor
                }
              }')
            EVENT_TYPE="pull_request"
          elif [ "$GITHUB_EVENT" = "push" ]; then
            PAYLOAD=$(jq -n \
              --arg ref "$PUSH_REF" \
              --arg after "$PUSH_SHA" \
              --arg before "$PUSH_BEFORE" \
              --arg repo_name "$REPO_FULL_NAME" \
              --arg actor "$ACTOR" \
              '{
                ref: $ref,
                after: $after,
                before: $before,
                repository: {
                  full_name: $repo_name,
                  clone_url: ("https://github.com/" + $repo_name + ".git")
                },
                sender: {
                  login: $actor
                }
              }')
            EVENT_TYPE="push"
          else
            # Manual dispatch - treat as push to current ref
            PAYLOAD=$(jq -n \
              --arg ref "$PUSH_REF" \
              --arg after "$PUSH_SHA" \
              --arg repo_name "$REPO_FULL_NAME" \
              --arg actor "$ACTOR" \
              --arg mode "${INPUT_MODE:-analysis}" \
              --arg timeout "${INPUT_TIMEOUT:-60m}" \
              --argjson full_scan "${INPUT_FULL_SCAN:-false}" \
              '{
                ref: $ref,
                after: $after,
                repository: {
                  full_name: $repo_name,
                  clone_url: ("https://github.com/" + $repo_name + ".git")
                },
                sender: {
                  login: $actor
                },
                workflow_dispatch: {
                  mode: $mode,
                  timeout: $timeout,
                  full_scan: $full_scan
                }
              }')
            EVENT_TYPE="push"
          fi

          echo "Triggering Aetheris worker..."
          echo "Event: $EVENT_TYPE"
          echo "Repository: $REPO_FULL_NAME"

          # Calculate signature if secret is set
          SIGNATURE_HEADER=""
          if [ -n "$WEBHOOK_SECRET" ]; then
            SIGNATURE="sha256=$(echo -n "$PAYLOAD" | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" | cut -d' ' -f2)"
            SIGNATURE_HEADER="X-Hub-Signature-256: $SIGNATURE"
          fi

          # Send webhook to Railway worker
          if [ -n "$SIGNATURE_HEADER" ]; then
            RESPONSE=$(curl -s -w "\n%{http_code}" \
              -X POST \
              -H "Content-Type: application/json" \
              -H "X-GitHub-Event: $EVENT_TYPE" \
              -H "$SIGNATURE_HEADER" \
              -d "$PAYLOAD" \
              "${WORKER_URL}/webhook/github")
          else
            RESPONSE=$(curl -s -w "\n%{http_code}" \
              -X POST \
              -H "Content-Type: application/json" \
              -H "X-GitHub-Event: $EVENT_TYPE" \
              -d "$PAYLOAD" \
              "${WORKER_URL}/webhook/github")
          fi

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "Response: $BODY"
          echo "HTTP Code: $HTTP_CODE"

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "✓ Analysis triggered successfully"
            echo ""
            echo "The Aetheris worker will:"
            echo "  1. Clone the repository"
            echo "  2. Run AI-powered code analysis"
            echo "  3. Post results as PR comments (for PRs) or commit status (for pushes)"
            echo ""
            echo "Check your Railway dashboard for worker logs."
          else
            echo "::error::Failed to trigger worker (HTTP $HTTP_CODE)"
            exit 1
          fi

      # ==================================
      # Status Summary
      # ==================================
      - name: Summary
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "## Aetheris Analysis Triggered" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Detail | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Event | $EVENT_NAME |" >> $GITHUB_STEP_SUMMARY
          echo "| Repository | $REPO |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch/Ref | $REF |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | $SHA |" >> $GITHUB_STEP_SUMMARY
          echo "| Actor | $ACTOR |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Analysis is running on the Railway worker. Results will be posted:" >> $GITHUB_STEP_SUMMARY
          echo "- **Pull Requests**: As PR comments" >> $GITHUB_STEP_SUMMARY
          echo "- **Push events**: As commit status checks" >> $GITHUB_STEP_SUMMARY
