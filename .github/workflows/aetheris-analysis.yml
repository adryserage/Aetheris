# =============================================================================
# Aetheris Code Analysis - GitHub Actions Template (v2.13)
# =============================================================================
#
# This workflow template provides automated AI-powered code analysis for your
# repository using Aetheris. Copy this file to your .github/workflows/ directory.
#
# SETUP:
# 1. Add your AI API key as a repository secret named AETHERIS_API_KEY
#    Settings > Secrets > Actions > New repository secret
# 2. Optional: Customize triggers and options below
#
# FEATURES:
# - Automatic analysis on push to main/develop branches
# - Pull request analysis with comments
# - Manual trigger with mode selection (analysis/fix)
# - Changed files detection for efficient scans
# - Downloadable analysis reports
#
# =============================================================================

name: Aetheris Analysis

on:
  # Automatic triggers
  push:
    branches: [main, develop]
  pull_request:
    types: [opened, synchronize, reopened]

  # Manual trigger with options
  workflow_dispatch:
    inputs:
      mode:
        description: "Analysis mode"
        type: choice
        options:
          - analysis
          - fix
        default: analysis
      timeout:
        description: "Timeout duration (e.g., 30m, 1h, 2h)"
        type: string
        default: "60m"
      full_scan:
        description: "Force full codebase scan"
        type: boolean
        default: false

# Prevent concurrent runs on the same branch
concurrency:
  group: aetheris-${{ github.ref }}
  cancel-in-progress: true

env:
  # Python version for analysis
  PYTHON_VERSION: "3.11"
  # Default timeout (can be overridden via workflow_dispatch)
  DEFAULT_TIMEOUT: "60m"

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 6-hour GitHub Actions limit

    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      # ==================================
      # Setup
      # ==================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for change detection

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install Aetheris
        run: |
          pip install --upgrade pip
          pip install adryserage-aetheris

      # ==================================
      # API Key Validation
      # ==================================
      - name: Validate API key
        env:
          API_KEY: ${{ secrets.AETHERIS_API_KEY }}
        run: |
          if [ -z "$API_KEY" ]; then
            echo "::error::Missing AETHERIS_API_KEY secret"
            echo ""
            echo "To fix this:"
            echo "1. Go to Settings > Secrets and variables > Actions"
            echo "2. Click 'New repository secret'"
            echo "3. Name: AETHERIS_API_KEY"
            echo "4. Value: Your Gemini/OpenAI/Claude API key"
            echo ""
            echo "Get a free API key:"
            echo "  - Gemini: https://ai.google.dev"
            echo "  - OpenAI: https://platform.openai.com/api-keys"
            echo "  - Claude: https://console.anthropic.com"
            exit 1
          fi

      # ==================================
      # Changed Files Detection
      # ==================================
      - name: Get changed files
        id: changed
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          FULL_SCAN: ${{ inputs.full_scan }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ] || ([ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$FULL_SCAN" != "true" ]); then
            if [ "$EVENT_NAME" = "pull_request" ]; then
              # Get files changed in PR
              CHANGED=$(git diff --name-only "origin/$BASE_REF"...HEAD | grep -E '\.(py|js|ts|tsx|jsx|java|go|rs|rb|php|c|cpp|cs|kt|swift|dart)$' | tr '\n' ',' | sed 's/,$//')
            else
              # Get files changed since last commit
              CHANGED=$(git diff --name-only HEAD~1 | grep -E '\.(py|js|ts|tsx|jsx|java|go|rs|rb|php|c|cpp|cs|kt|swift|dart)$' | tr '\n' ',' | sed 's/,$//')
            fi

            if [ -z "$CHANGED" ]; then
              echo "files=" >> "$GITHUB_OUTPUT"
              echo "has_changes=false" >> "$GITHUB_OUTPUT"
            else
              echo "files=$CHANGED" >> "$GITHUB_OUTPUT"
              echo "has_changes=true" >> "$GITHUB_OUTPUT"
            fi
            echo "Changed files: $CHANGED"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "Full scan requested"
          fi

      # ==================================
      # Run Analysis
      # ==================================
      - name: Run Aetheris analysis
        if: steps.changed.outputs.has_changes != 'false'
        env:
          GEMINI_API_KEY: ${{ secrets.AETHERIS_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.AETHERIS_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.AETHERIS_API_KEY }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_TIMEOUT: ${{ inputs.timeout }}
          INPUT_FULL_SCAN: ${{ inputs.full_scan }}
          CHANGED_FILES: ${{ steps.changed.outputs.files }}
        run: |
          # Determine timeout (use default if not provided)
          TIMEOUT="${INPUT_TIMEOUT:-$DEFAULT_TIMEOUT}"

          # Determine mode (default to analysis)
          MODE="${INPUT_MODE:-analysis}"

          # Build command
          if [ "$MODE" = "fix" ]; then
            CMD="aetheris fix --analyze-first --auto"
          else
            CMD="aetheris analysis --profile ci --timeout $TIMEOUT"
          fi

          # Add changed files if available and not full scan
          if [ -n "$CHANGED_FILES" ] && [ "$INPUT_FULL_SCAN" != "true" ]; then
            CMD="$CMD --changed-files-only --files \"$CHANGED_FILES\""
          fi

          echo "Running: $CMD"
          eval "$CMD" || true  # Don't fail the workflow on analysis issues

      - name: Skip message (no changes)
        if: steps.changed.outputs.has_changes == 'false'
        run: |
          echo "No code files changed - skipping analysis"

      # ==================================
      # Upload Artifacts
      # ==================================
      - name: Prepare artifact
        if: always()
        run: |
          mkdir -p artifact/docs
          cp -r docs/analyses artifact/docs/ 2>/dev/null || true
          cp -r docs/architecture_overview.md artifact/docs/ 2>/dev/null || true

          # Create README for artifact
          cat > artifact/README.md << 'ARTIFACT_EOF'
          # Aetheris Analysis Results

          This archive contains the code analysis reports generated by Aetheris.

          ## Contents

          - `docs/analyses/` - Individual file analysis reports
          - `docs/architecture_overview.md` - Architecture analysis

          ## Viewing Results

          1. Extract this archive
          2. Open `docs/analyses/` in your browser or Markdown viewer
          3. Review the findings and recommendations

          ## Running Locally

          To run Aetheris locally:

          ```bash
          pip install adryserage-aetheris
          export GEMINI_API_KEY=your_key_here
          aetheris analysis
          ```

          ## Learn More

          - [Aetheris Documentation](https://adryserage.github.io/aetheris/)
          - [PyPI Package](https://pypi.org/project/adryserage-aetheris/)
          ARTIFACT_EOF

      - name: Upload analysis artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aetheris-analysis-${{ github.sha }}
          path: artifact/
          retention-days: 30

      # ==================================
      # PR Comment
      # ==================================
      - name: Comment on PR
        if: github.event_name == 'pull_request' && steps.changed.outputs.has_changes != 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            // Read analysis summary if available
            let summary = '';
            const qaReportPath = 'docs/analyses/quality_assurance_report.md';

            if (fs.existsSync(qaReportPath)) {
              const content = fs.readFileSync(qaReportPath, 'utf8');
              // Extract first section as summary (limit to prevent huge comments)
              const lines = content.split('\n').slice(0, 30);
              summary = lines.join('\n');
            }

            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const body = `## Aetheris Analysis Complete

            ${summary ? '### Summary\n\n' + summary : ''}

            **Download full results:** [Analysis Artifacts](${runUrl})

            ---
            *Generated by [Aetheris](https://pypi.org/project/adryserage-aetheris/) v2.13*
            `;

            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });

            const botComment = comments.find(c =>
              c.user.type === 'Bot' &&
              c.body.includes('Aetheris Analysis Complete')
            );

            if (botComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }
