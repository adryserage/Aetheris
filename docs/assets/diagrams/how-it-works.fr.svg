" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1F2933" text-anchor="middle">10 agents, 152 règles</text><text x="500" y="260" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1F2933" text-anchor="middle">Vérifications sans IA</text><text x="500" y="278" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1F2933" text-anchor="middle">7 méthodes de revue</text><line x1="270" y1="228" x2="388" y2="228" stroke="#52606D" stroke-width="1.6" marker-end="url(#ink)"/><text x="330" y="220" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52606D" text-anchor="middle">appels d'outils</text><line x1="390" y1="262" x2="272" y2="262" stroke="#52606D" stroke-width="1.6" marker-end="url(#ink)"/><text x="330" y="280" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52606D" text-anchor="middle">règles, résultats</text><rect x="50" y="350" width="560" height="70" rx="10" fill="#FFFFFF" stroke="#9AA5B1" stroke-width="1.5"/><text x="330" y="378" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1F2933" text-anchor="middle">Votre projet</text><text x="330" y="400" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52606D" text-anchor="middle">fichiers source, diff git, fichiers de verrouillage</text><line x1="160" y1="300" x2="160" y2="348" stroke="#52606D" stroke-width="1.6" marker-end="url(#ink)"/><text x="170" y="329" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52606D" text-anchor="start">lit</text><line x1="500" y1="300" x2="500" y2="348" stroke="#52606D" stroke-width="1.6" marker-end="url(#ink)"/><text x="490" y="329" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52606D" text-anchor="end">lit (racine seulement)</text><rect x="720" y="190" width="160" height="110" rx="10" fill="#FDF3E7" stroke="#B45309" stroke-width="2"/><text x="800" y="222" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#92400E" text-anchor="middle">OSV.dev</text><text x="800" y="248" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle">Base des failles</text><text x="800" y="264" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle">connues</text><line x1="610" y1="245" x2="718" y2="245" stroke="#B45309" stroke-width="1.6" marker-end="url(#net)"/><text x="665" y="265" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle">paquets,</text><text x="665" y="280" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#92400E" text-anchor="middle">versions</text><text x="800" y="322" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#92400E" text-anchor="middle">le seul appel réseau</text></svg>
