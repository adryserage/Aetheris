<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-label="L'assistant appelle Aetheris par MCP. Aetheris lit le projet et n'appelle jamais de modèle d'IA ; son seul appel réseau envoie des noms et versions de paquets à OSV."><title>L'assistant appelle Aetheris par MCP. Aetheris lit le projet et n'appelle jamais de modèle d'IA ; son seul appel réseau envoie des noms et versions de paquets à OSV.</title><defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#52606D"/></marker><marker id="ink-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#52606D"/></marker><marker id="net" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker><marker id="net-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#B45309"/></marker><marker id="accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0F6E8C"/></marker><marker id="accent-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#0F6E8C"/></marker></defs><rect width="900" height="470" rx="14" fill="#F5F7FA"/><text x="32" y="40" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#1F2933" text-anchor="start">Fonctionnement d'Aetheris</text><rect x="40" y="62" width="240" height="56" rx="10" fill="#EEF1F4" stroke="#9AA5B1" stroke-width="1.5"/><text x="160" y="86" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#52606D" text-anchor="middle">Fournisseur IA de l'assistant</text><text x="160" 