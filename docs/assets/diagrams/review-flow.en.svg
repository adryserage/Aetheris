<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" role="img" aria-label="Review flow: plan_review picks files and agents; for each agent the assistant calls get_rules, get_playbook and run_checks and reviews the code; synthesize_report merges, sorts and scores the findings."><title>Review flow: plan_review picks files and agents; for each agent the assistant calls get_rules, get_playbook and run_checks and reviews the code; synthesize_report merges, sorts and scores the findings.</title><defs><marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#52606D"/></marker><marker id="ink-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#52606D"/></marker><marker id="net" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#B45309"/></marker><marker id="net-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#B45309"/></marker><marker id="accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0F6E8C"/></marker><marker id="accent-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#0F6E8C"/></marker></defs><rect width="900" height="440" rx="14" fill="#F5F7FA"/><text x="32" y="40" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#1F2933" text-anchor="start">Review flow</text><text x="32" y="62" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#52606D" text-anchor="start">Your assistant calls the tools in this order.</text><rect x="24" y="100" width="176" height="110" rx="10" fill="#E6F3F7" stroke="#0F6E8C" stroke-width="1.5"/><text x="112.0" y="128" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="bold" fill="#0F6E8C" text-anchor="middle">plan_review</text><text x="112.0" y="152" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52606D" text-anchor="middle">files by priority,</text><text x="112.0" y="169" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52606D" text-anchor="middle">agents to run</text><rect x="234" y="84" width="446" height="166" rx="12" fill="none" stroke="#0F6E8C" stroke-width="1.5" stroke-dasharray="6 5"/><text x="250" y="104" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#0F6E8C" text-anchor="start">for each agent in the plan</text><rect x="250" y="116" width="132" height="96" rx="10" fill="#FFFFFF" stroke="#0F6E8C" stroke-width="1.5"/><text x="316.0" y="144" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="bold" fill="#0F6E8C" text-anchor="middle">get_rules</text><text x="316.0" y="168" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52606D" text-anchor="middle">rules for the</text><text x="316.0" y="185" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52606D" text-anchor="middle">languages found</text><rect x="390" y="116" width="132" height="96" rx="10" fill="#FFFFFF" stroke="#0F6E8C" stroke-width="1.5"/><text x="456.0" y="144" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="bold" fill="#0F6E8C" text-anchor="middle">get_playbook</text><text x="456.0" y="168" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-se