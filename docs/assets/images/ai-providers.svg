<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="200" fill="#fafafa"/>

  <!-- Title -->
  <text x="300" y="25" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333">Supported AI Providers</text>

  <!-- Aetheris Center -->
  <rect x="230" y="60" width="140" height="70" rx="8" fill="#fff3e0" stroke="#f57c00" stroke-width="2" filter="url(#shadow)"/>
  <text x="300" y="90" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#f57c00">Aetheris</text>
  <text x="300" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#555">AI Provider Abstraction</text>

  <!-- Gemini -->
  <rect x="40" y="150" width="140" height="40" rx="6" fill="#e8f5e9" stroke="#388e3c" stroke-width="2" filter="url(#shadow)"/>
  <text x="110" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#388e3c">Gemini</text>

  <!-- OpenAI -->
  <rect x="230" y="150" width="140" height="40" rx="6" fill="#e3f2fd" stroke="#1976d2" stroke-width="2" filter="url(#shadow)"/>
  <text x="300" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1976d2">OpenAI</text>

  <!-- Claude -->
  <rect x="420" y="150" width="140" height="40" rx="6" fill="#fce4ec" stroke="#c2185b" stroke-width="2" filter="url(#shadow)"/>
  <text x="490" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#c2185b">Claude</text>

  <!-- Connecting lines -->
  <line x1="260" y1="130" x2="110" y2="150" stroke="#999" stroke-width="1.5"/>
  <line x1="300" y1="130" x2="300" y2="150" stroke="#999" stroke-width="1.5"/>
  <line x1="340" y1="130" x2="490" y2="150" stroke="#999" stroke-width="1.5"/>
</svg>
