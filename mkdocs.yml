site_name: Aetheris
site_description: MCP server that gives AI coding assistants review rules, playbooks and checks that need no AI
site_url: https://adryserage.github.io/Aetheris/
repo_url: https://github.com/adryserage/aetheris
repo_name: adryserage/aetheris

exclude_docs: |
  archive/

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - minify:
      minify_html: true

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.mark
  - admonition
  - tables
  - attr_list
  - md_in_html

nav:
  - Home: index.md
  - Getting started:
    - Installation: installation.md
    - Review flow: review-flow.md
  - Reference:
    - Tools: tools.md
    - Agents: agents.md
    - Playbooks: playbooks.md
    - Rules:
      - Overview: rules/index.md
      - Security: rules/security.md
      - Architecture: rules/architecture.md
      - Code quality: rules/code_quality.md
      - Metrics: rules/metrics.md
      - Dependencies: rules/dependency.md
      - QA synthesis: rules/qa_synthesis.md
      - Type safety: rules/type_safety.md
      - Performance: rules/performance.md
      - API contract: rules/api_contract.md
      - Data privacy: rules/data_privacy.md
  - About:
    - Security: security.md
    - Migrating from 3.x: migration.md
    - Contributing: contributing.md
    - Releasing: releasing.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/adryserage/aetheris
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/adryserage-aetheris/
