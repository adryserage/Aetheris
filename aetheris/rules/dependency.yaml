agent: dependency
name: Dependencies
summary: Checks declared third-party packages for known vulnerabilities through OSV and reviews how dependencies are pinned and sourced.
rules:
  - id: DEP-001
    title: Dependency with a known vulnerability
    severity: high
    check: >-
      Report each package version the OSV lookup matches to an advisory, with the advisory
      id, the CVE alias when there is one, and the first fixed version. Use the advisory's own
      severity when it gives one (critical, high, moderate as medium, low) and high otherwise.
      Lower it to low only when the vulnerable function is clearly unused, and say why.
    languages: []
    references: [CWE-1395, "OWASP A06:2021"]
  - id: DEP-002
    title: Vulnerable version with no fix available
    severity: medium
    check: >-
      For an advisory with no fixed version, say so explicitly and name the mitigation the
      advisory gives, or the alternative package if the project is abandoned. Do not suggest
      an upgrade that does not exist.
    languages: []
    references: [CWE-1395, "OWASP A06:2021"]
  - id: DEP-003
    title: Version range resolves differently from what was checked
    severity: medium
    check: >-
      Look for ranges (`^`, `~`, `>=`, `*`, `latest`, no version at all) in manifests. The
      vulnerability lookup checks the version written in the range with its operator removed,
      so the installed version can differ from the one checked; read the lockfile when it exists to get the real
      resolved version before reporting. Exact pins and ranges backed by a committed lockfile
      are not violations.
    languages: []
    references: []
  - id: DEP-004
    title: Application without a lockfile
    severity: medium
    check: >-
      Look for an application (a deployed service, CLI or site, as opposed to a library) that
      declares dependencies with ranges and commits no lockfile (`package-lock.json`,
      `yarn.lock`, `pnpm-lock.yaml`, `poetry.lock`, `uv.lock`, `Pipfile.lock`, `Cargo.lock`,
      `go.sum`, `pubspec.lock`, `composer.lock`, `Gemfile.lock`). Libraries that publish ranges
      on purpose are not violations.
    languages: []
    references: [CWE-1104]
  - id: DEP-005
    title: Dependency fetched from an untrusted source
    severity: high
    check: >-
      Look for dependencies installed from a raw URL, a Git branch, a personal fork, a
      tarball over plain HTTP, or an extra package index that could shadow public names
      (dependency confusion). A Git dependency pinned to a commit hash from the project's own
      organization is low; a private registry configured as the only index is not a violation.
    languages: []
    references: [CWE-829, CWE-494, "OWASP A08:2021"]
  - id: DEP-006
    title: Install script runs remote code
    severity: high
    check: >-
      Look for `postinstall` or `preinstall` scripts, `setup.py` code, Dockerfile steps or CI
      steps that pipe a downloaded script into a shell (`curl ... | sh`) or download a binary
      without checking a hash or signature. Steps that verify a checksum or use a pinned,
      signed package are not violations.
    languages: []
    references: [CWE-494, "OWASP A08:2021"]
  - id: DEP-007
    title: Package declared but unused
    severity: low
    check: >-
      Look for runtime dependencies that no source file imports, and for dev tools listed as
      runtime dependencies. Plugins loaded by name (pytest plugins, Babel presets, ESLint
      configs), type stubs and CLI tools invoked from scripts count as used.
    languages: []
    references: []
  - id: DEP-008
    title: Package used but not declared
    severity: high
    check: >-
      Look for third-party imports in source code that no manifest declares, so the code
      works only because a transitive dependency happens to pull them in. Standard library
      modules and packages declared in an optional extra that guards the import are not
      violations.
    languages: []
    references: []
  - id: DEP-009
    title: Unmaintained or deprecated package
    severity: medium
    check: >-
      Look for packages the registry marks as deprecated, archived or yanked, or that the
      advisory data describes as unmaintained, and name the replacement the package itself
      recommends. Do not call a package unmaintained from memory of its release history;
      only report what the data or the package's own notice says.
    languages: []
    references: [CWE-1104, "OWASP A06:2021"]
  - id: DEP-010
    title: Duplicate or conflicting declarations
    severity: low
    check: >-
      Look for the same package declared twice with different versions, across
      `requirements.txt` and `pyproject.toml`, or across `dependencies` and
      `devDependencies`. Separate manifests for separate deployables in a monorepo are not
      violations.
    languages: []
    references: []
  - id: DEP-011
    title: Lookup failed or ecosystem unsupported
    severity: info
    check: >-
      When the OSV lookup returns an error, or a manifest belongs to an ecosystem the check
      does not parse, report it once with the manifest path so the reader knows those packages
      were not checked. Never describe unchecked packages as safe.
    languages: []
    references: []
